name: usage
version: 1.1.3
description: "/tokenstats slash command — token totals and cost from the token-stats known ledger (read-only)."
author: Thorballer
kind: standalone
platforms:
  - linux
  - macos
# NOTE: no provides_hooks/commands key — Hermes' validator buckets
# ctx.register_command under "commands", which it checks against no
# provides_* key; declaring it under provides_hooks ("register_command"
# is not a hook name) only produces a false "declared but not
# registered" warning from `hermes plugin validate`.
